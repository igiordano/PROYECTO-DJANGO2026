{% extends 'Autopartes/index.html' %}
{% load static %}

{% block title %}Registro - Autopartes{% endblock title %}

{% load crispy_forms_tags %}

{% block codigoDinamico %}
<div class="container text-center">
<h2>Registro de Cliente</h2>
</div>
<div class="container form-container">
    <form method="post">{% csrf_token %}
        
        {{ form|crispy }}

        <button type="submit" class="btn-orange">Registrarse</button>
    </form> 
    <br>  

    <p class="login-redirect-text">
    ¿Ya tienes cuenta? <a href="{% url 'login_cliente' %}" class="link-orange">Ingresa aquí</a>
</p>
</div>

{% endblock codigoDinamico %}

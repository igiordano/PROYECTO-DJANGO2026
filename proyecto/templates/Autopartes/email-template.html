<table style="width: 100%; border-collapse: collapse; font-family: Arial, sans-serif;">
    <tr style="border-bottom: 1px solid #ddd;">
        <td style="padding: 10px; font-weight: bold; background-color: #f8f9fa; width: 30%;">Nombre y Apellido</td>
        <td style="padding: 10px;">{{ nombre }}</td>
    </tr>
    <tr style="border-bottom: 1px solid #ddd;">
        <td style="padding: 10px; font-weight: bold; background-color: #f8f9fa;">Correo Electrónico</td>
        <td style="padding: 10px;">{{ email }}</td>
    </tr>
    <tr style="border-bottom: 1px solid #ddd;">
        <td style="padding: 10px; font-weight: bold; background-color: #f8f9fa;">Asunto</td>
        <td style="padding: 10px;">{{ asunto }}</td>
    </tr>
    <tr style="border-bottom: 1px solid #ddd;">
        <td style="padding: 10px; font-weight: bold; background-color: #f8f9fa;">Mensaje</td>
        <td style="padding: 10px;">{{ mensaje }}</td>
    </tr>
</table>

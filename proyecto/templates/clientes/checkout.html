{% extends 'Autopartes/index.html' %}
{% load static %}

{% block title %}Checkout - Autopartes{% endblock title %}

{% block codigoDinamico %}
<style>
    .checkout-wrapper {
        max-width: 600px;
        margin: 30px auto;
        padding: 0 15px;
    }

    .nav-panel-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #1a202c;
        padding: 12px 20px;
        border-radius: 8px;
        margin-bottom: 25px;
    }

    .btn-back-panel {
        display: inline-flex;
        align-items: center;
        background-color: #FF5100;
        color: #ffffff !important;
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none !important;
        font-weight: 700;
        font-size: 0.9rem;
        transition: background-color 0.2s ease;
    }

    .btn-back-panel:hover {
        background-color: #E04700;
    }

    .checkout-card {
        background-color: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 30px;
    }

    .form-control-select {
        width: 100%;
        padding: 10px;
        border: 1px solid #cbd5e0;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .btn-confirm {
        width: 100%;
        padding: 12px;
        background-color: #FF5100;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
    }
</style>

<div class="checkout-wrapper">
    <!-- Barra superior de navegación hacia el panel -->
    <div class="nav-panel-bar">
        <a href="{% url 'panel_cliente' %}" class="btn-back-panel">
            ← Volver al panel
        </a>
        <span style="color: #e2e8f0; font-weight: 600; font-size: 0.9rem;">
            Usuario: {{ request.user.username }}
        </span>
    </div>

    <div class="checkout-card">
        <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 20px;">Finalizar Compra</h1>

        <div style="background-color: #f7fafc; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
            <span style="color: #4a5568; font-weight: 600;">Total del pedido:</span>
            <strong style="font-size: 1.4rem; color: #111111;">${{ total }}</strong>
        </div>

        <form method="post">
            {% csrf_token %}
            <label for="metodo_pago" style="display: block; font-weight: 700; margin-bottom: 8px; color: #4a5568;">Método de Pago:</label>
            <select name="metodo_pago" id="metodo_pago" class="form-control-select">
                <option value="efectivo">Efectivo</option>
                <option value="tarjeta">Tarjeta de Crédito / Débito</option>
                <option value="transferencia">Transferencia Bancaria</option>
            </select>

            <button type="submit" class="btn-confirm">Confirmar y Comprar</button>
        </form>
    </div>
</div>
{% endblock codigoDinamico %}
